name: Update support app
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          ref: master
          path: nextcloud/apps/support
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Fetch releases
        run: bash fetch-support-app.sh
      - name: Push
        run: |
          git -C nextcloud/apps/support push origin master
          git -C nextcloud/apps/support push --force origin --tags
